[project]
name = "rappen"
version = "0.1.0"
description = "Import bank exports into one SQLite ledger, exposed over MCP and a CLI."
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "mcp>=1.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rappen = "rappen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rappen"]

[tool.pytest.ini_options]
testpaths = ["tests", "rappen/parsers"]
